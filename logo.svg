<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="20" result="blur1"/>
      <feGaussianBlur stdDeviation="9" result="blur2"/>
      <feGaussianBlur stdDeviation="3" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="#3dff3d">
    <!-- Left bar (italic parallelogram, leaning right) -->
    <polygon points="150,85 192,85 172,435 130,435"/>
    <!-- Diagonal (N crossbar, top-left to bottom-right) -->
    <polygon points="192,85 234,85 344,435 302,435"/>
    <!-- Right bar (italic parallelogram, leaning right) -->
    <polygon points="322,85 364,85 344,435 302,435"/>
  </g>
</svg>
