name = "nolvek"          # must match the Worker in the dashboard that owns
                        # chat.nolvek.online and the secrets — a different
                        # name here deploys to a different Worker entirely
main = "src/index.js"
compatibility_date = "2026-08-01"

# Plain vars. Secrets are NOT here — set them with `wrangler secret put`:
#   wrangler secret put SESSION_SECRET     (any long random string)
#   wrangler secret put TURNSTILE_SECRET   (Cloudflare Turnstile dashboard)
#   wrangler secret put GROQ_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY
# Every deploy REPLACES the Worker's plain-text variables with this block.
# Editing them in the dashboard does not survive the next build — change them
# here. (Secrets are not affected: wrangler secret put / the dashboard's Secret
# type are stored separately and are never touched by a deploy.)
[vars]
PROVIDER = "anthropic"     # "groq" | "anthropic" — the other is the failover.
                           # Anthropic leads: the failure mode here is quoting a
                           # price we do not charge, and the small Groq models hold
                           # that constraint less reliably.
CHAT_ENABLED = "true"      # flip to "false" to kill the assistant in ~30s
DEBUG = "false"            # "true" adds error_message to every error response.
                           # Diagnostics only — turn it back off when done.
# Groq rotates and deprecates model slugs, so this is config rather than code.
# Read the current list before setting it:
#   curl -H "Authorization: Bearer $GROQ_API_KEY" \
#        https://api.groq.com/openai/v1/models
GROQ_MODEL = "llama-3.1-8b-instant"   # read from the live list; Groq rotates slugs

# Your own Worker AI. PROVIDER stays "anthropic" until you have proved this one
# out with:  GET /probe?provider=nolvek-llm   (needs DEBUG="true")
NOLVEK_LLM_URL = "https://nolvek-llm.kevlongalloway1999m.workers.dev"
# NOLVEK_LLM_MODEL = ""    # only if your Worker expects a model name
# NOLVEK_LLM_KEY is a SECRET, not a var — wrangler secret put NOLVEK_LLM_KEY

# Per-IP rate limiting. Free, stateless, and counted per colo rather than
# globally — acceptable here because the signed turn counter already caps
# spend per conversation, and /session is what gates conversation creation.
[[unsafe.bindings]]
name = "CHAT_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "SESSION_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Route. The Worker must answer on its own hostname so the static site on
# Render is untouched.
# [[routes]]
# pattern = "chat.nolvek.online/*"
# zone_name = "nolvek.online"
