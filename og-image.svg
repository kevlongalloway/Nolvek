<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="logoG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8ff3e"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowLime" cx="50%" cy="105%" r="60%">
      <stop offset="0%" stop-color="#a8ff3e" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#a8ff3e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bgClip">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="1" fill="rgba(255,255,255,0.05)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glows -->
  <ellipse cx="600" cy="760" rx="720" ry="420" fill="url(#glowLime)" clip-path="url(#bgClip)"/>
  <ellipse cx="600" cy="380" rx="500" ry="280" fill="url(#glowCenter)" clip-path="url(#bgClip)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#logoG)"/>

  <!-- Logo mark -->
  <g transform="translate(64, 48)">
    <rect width="72" height="72" rx="14" fill="#1c1c1f" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="14" y="12" width="13" height="49" rx="2" fill="url(#logoG)"/>
    <polygon points="27,12 40,12 46,61 33,61" fill="url(#logoG)"/>
    <rect x="46" y="12" width="13" height="49" rx="2" fill="url(#logoG)"/>
  </g>

  <!-- NOLVEK wordmark -->
  <text x="152" y="98"
    font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900" font-size="38" letter-spacing="-1"
    fill="white">NOLV</text>
  <text x="243" y="98"
    font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900" font-size="38" letter-spacing="-1"
    fill="url(#logoG)">EK</text>

  <!-- Atlanta badge -->
  <rect x="64" y="118" width="148" height="26" rx="13"
    fill="rgba(168,255,62,0.1)" stroke="rgba(168,255,62,0.25)" stroke-width="1"/>
  <text x="138" y="136"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="600" font-size="13" fill="#a8ff3e"
    text-anchor="middle" letter-spacing="1">ATLANTA, GA</text>

  <!-- Main headline -->
  <text x="600" y="295"
    font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900" font-size="62" fill="white"
    text-anchor="middle" letter-spacing="-1.5">Your Competition Is Online.</text>

  <!-- Accent headline -->
  <text x="600" y="388"
    font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900" font-size="76" fill="url(#logoG)"
    text-anchor="middle" letter-spacing="-2">Are You Winning?</text>

  <!-- Services strip -->
  <text x="600" y="480"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400" font-size="22"
    fill="rgba(255,255,255,0.4)"
    text-anchor="middle" letter-spacing="1.5">Websites · Ads · AI Automation · Custom Software</text>

  <!-- Domain -->
  <text x="600" y="564"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700" font-size="20"
    fill="rgba(255,255,255,0.22)"
    text-anchor="middle" letter-spacing="3">NOLVEK.ONLINE</text>

  <!-- Bottom border -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#logoG)"/>
</svg>
