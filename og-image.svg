<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="logoG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8ff3e"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="ctaG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8ff3e"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <radialGradient id="glowLime" cx="50%" cy="105%" r="60%">
      <stop offset="0%" stop-color="#a8ff3e" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#a8ff3e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bgClip">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
    <circle cx="18" cy="18" r="1" fill="rgba(255,255,255,0.045)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Glows -->
  <ellipse cx="600" cy="760" rx="720" ry="420" fill="url(#glowLime)" clip-path="url(#bgClip)"/>
  <ellipse cx="600" cy="340" rx="520" ry="300" fill="url(#glowCenter)" clip-path="url(#bgClip)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#logoG)"/>

  <!-- Logo mark centered top (144x144, 2x scale) -->
  <g transform="translate(528, 48)">
    <rect width="144" height="144" rx="26" fill="#1c1c1f" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect x="28" y="24" width="26" height="96" rx="4" fill="url(#logoG)"/>
    <polygon points="54,24 80,24 92,120 66,120" fill="url(#logoG)"/>
    <rect x="92" y="24" width="26" height="96" rx="4" fill="url(#logoG)"/>
  </g>

  <!-- Atlanta badge centered below logo -->
  <rect x="536" y="210" width="128" height="26" rx="13"
    fill="rgba(168,255,62,0.1)" stroke="rgba(168,255,62,0.25)" stroke-width="1"/>
  <text x="600" y="228"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="600" font-size="12" fill="#a8ff3e"
    text-anchor="middle" letter-spacing="1.5">ATLANTA, GA</text>

  <!-- Main headline -->
  <text x="600" y="308"
    font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900" font-size="58" fill="white"
    text-anchor="middle" letter-spacing="-1.5">Your Competition Is Online.</text>

  <!-- Accent headline -->
  <text x="600" y="390"
    font-family="'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900" font-size="72" fill="url(#logoG)"
    text-anchor="middle" letter-spacing="-2">Are You Winning?</text>

  <!-- Services strip -->
  <text x="600" y="455"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400" font-size="20"
    fill="rgba(255,255,255,0.38)"
    text-anchor="middle" letter-spacing="1.5">Websites · Ads · AI Automation · Custom Software</text>

  <!-- CTA pill -->
  <rect x="400" y="488" width="400" height="54" rx="27" fill="url(#ctaG)"/>
  <text x="600" y="521"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900" font-size="20" fill="#09090b"
    text-anchor="middle" letter-spacing="0.5">Book a Free Strategy Call</text>

  <!-- Bottom border -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#logoG)"/>
</svg>
